name: android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships the Android SDK (ANDROID_HOME); AGP fetches a missing platform itself.
      - run: ./gradlew :mesh-core:test :simulator:test :app:testDebugUnitTest :app:assembleDebug
